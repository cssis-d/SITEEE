<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый сайт</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
      text-align: center;
    }
    header {
      background: #ffffff;
      padding: 25px;
      border-bottom: 1px solid #e5e5e5;
    }
    h1 { margin: 0; }
    main { padding: 80px 20px; }
    p { color: #555; line-height: 1.6; }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #4169e1;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    section {
      background: white;
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 12px;
    }
    footer { padding: 25px; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>Мой первый сайт</h1>
  </header>

  <main>
    <h2>Привет!</h2>
    <p>Это простая страница, созданная с помощью HTML и CSS.</p>
    <a class="button" href="#about">Узнать больше</a>
  </main>

  <section id="about">
    <h2>О сайте</h2>
    <p>Это мой первый небольшой проект. Здесь я учусь создавать и публиковать сайты.</p>
  </section>

  <footer>© 2026 Мой первый сайт</footer>
</body>
</html>
